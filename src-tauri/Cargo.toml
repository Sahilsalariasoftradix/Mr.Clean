[package]
name = "mr-clean"
description = "Mr.Clean desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mr_clean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mrclean-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "~2.4" # newest that works with Tauri 2.11; move up with the next Tauri bump
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
